  <style>
    /* Bloqueia toda a UI por padrão — liberada só após verificação de sessão */
    #app { visibility: hidden; }
    #glr-loading-inicial {
      position:fixed;inset:0;background:#f6f7f9;
      display:flex;align-items:center;justify-content:center;z-index:9999;
      font-family:Geist,-apple-system,sans-serif;
    }
    #glr-loading-inicial .spinner {
      width:34px;height:34px;border:3px solid rgba(79,70,229,0.15);
      border-top-color:#4f46e5;border-radius:50%;
      animation:glr-spin 0.8s linear infinite;margin:0 auto 16px;
    }
    @keyframes glr-spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }
    @media print {
      #sidebar,#header { display:none!important; }
      #main { margin-left:0!important; }
      #page-content { padding:0!important; }
      body { background:white!important; color:black!important; }
    }
  </style>
</head>
<body>
<script>
  // Tema antes de pintar a tela (padrão: claro). Evita o "flash" escuro no carregamento.
  (function () { try { var t = localStorage.getItem('glr_tema') || 'light'; document.body.classList.toggle('light', t === 'light');
    if (t !== 'light') document.write('<style>#glr-loading-inicial{background:#0b0c10!important}</style>');
    if (localStorage.getItem('glr_sidebar_mini') === '1') document.body.classList.add('sidebar-mini'); } catch (e) { document.body.classList.add('light'); } })();
</script>

<script>
  // ── Tema claro/escuro ────────────────────────────────────────
  function aplicarTema(tema) {
    document.body.classList.toggle('light', tema === 'light');
    const moon = document.getElementById('theme-icon-moon');
    const sun  = document.getElementById('theme-icon-sun');
    if (moon) moon.style.display = tema === 'light' ? 'none' : '';
    if (sun)  sun.style.display  = tema === 'light' ? '' : 'none';
    aplicarTemaGraficos();
  }
  // Paleta única dos gráficos (Chart.js) a partir dos tokens do tema
  function aplicarTemaGraficos() {
    if (!window.Chart) return;
    const cs = getComputedStyle(document.body);
    const v = n => cs.getPropertyValue(n).trim();
    const d = Chart.defaults;
    d.font.family = "'Geist', -apple-system, BlinkMacSystemFont, sans-serif";
    d.font.size = 12;
    d.color = v('--text-muted');
    d.borderColor = v('--border');
    Object.assign(d.plugins.legend.labels, { usePointStyle: true, boxWidth: 8, boxHeight: 8 });
    Object.assign(d.plugins.tooltip, {
      backgroundColor: v('--bg-card'), titleColor: v('--text-primary'), bodyColor: v('--text-secondary'),
      borderColor: v('--border-strong'), borderWidth: 1, padding: 10, cornerRadius: 10,
      boxPadding: 4, usePointStyle: true, titleFont: { weight: '600' },
    });
    if (!aplicarTemaGraficos.reg) {
      aplicarTemaGraficos.reg = true;
      // Segurança: o canvas não entende var(--token); converte para a cor real antes de desenhar
      const resolver = c => {
        if (typeof c !== 'string' || c.indexOf('var(') < 0) return c;
        return c.replace(/var\((--[\w-]+)\)/g, (m, n) => getComputedStyle(document.body).getPropertyValue(n).trim() || m);
      };
      const PROPS = ['borderColor', 'backgroundColor', 'pointBackgroundColor', 'pointBorderColor', 'hoverBackgroundColor', 'hoverBorderColor'];
      Chart.register({ id: 'glrCoresTema', beforeUpdate(ch) {
        (ch.config.data?.datasets || []).forEach(ds => PROPS.forEach(p => {
          const v = ds[p];
          if (v == null) return;
          if (Array.isArray(v)) ds[p] = v.map(resolver);
          else if (typeof v === 'function' && !v.__glr) { const f = v; ds[p] = (...a) => resolver(f(...a)); ds[p].__glr = true; }
          else ds[p] = resolver(v);
        }));
      } });
    }
    Object.values(Chart.instances || {}).forEach(c => { try { c.update('none'); } catch (e) {} });
  }
  function toggleTheme() {
    const novo = document.body.classList.contains('light') ? 'dark' : 'light';
    localStorage.setItem('glr_tema', novo);
    aplicarTema(novo);
  }
  aplicarTema(localStorage.getItem('glr_tema') || 'light');

  // ── Sidebar recolhível, dicas e breadcrumb ───────────────────
  window.alternarSidebarMini = function () {
    const on = !document.body.classList.contains('sidebar-mini');
    document.body.classList.toggle('sidebar-mini', on);
    try { localStorage.setItem('glr_sidebar_mini', on ? '1' : '0'); } catch (e) {}
  };
  (function () {
    const textoDe = b => [...b.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join(' ').replace(/\s+/g, ' ').trim();
    let dica = null;
    const prepararNav = () => document.querySelectorAll('#sidebar .nav-item').forEach(b => {
      if (b.dataset.tip) return;
      const t = textoDe(b); b.dataset.tip = t; b.setAttribute('aria-label', t);
      b.addEventListener('mouseenter', () => {
        if (!document.body.classList.contains('sidebar-mini') || window.innerWidth <= 900) return;
        const r = b.getBoundingClientRect();
        dica = dica || Object.assign(document.createElement('div'), { className: 'sb-dica' });
        dica.textContent = b.dataset.tip; dica.style.left = (r.right + 10) + 'px'; dica.style.top = (r.top + r.height / 2) + 'px';
        document.body.appendChild(dica);
      });
      b.addEventListener('mouseleave', () => dica && dica.remove());
    });
    // breadcrumb: seção do menu da página ativa
    const atualizarCrumb = () => {
      const ativo = document.querySelector('#sidebar .nav-item.active');
      const sec = ativo && ativo.closest('.sidebar-section')?.querySelector('.sidebar-section-title');
      const el = document.getElementById('page-crumb');
      if (el) el.textContent = sec ? (sec.querySelector('span')?.textContent || sec.textContent).trim() : ''; // grupo do menu (sem o contador)
    };
    const iniciar = () => {
      prepararNav(); atualizarCrumb();
      const t = document.getElementById('page-title');
      if (t) new MutationObserver(() => { prepararNav(); atualizarCrumb(); dica && dica.remove(); }).observe(t, { childList: true, characterData: true, subtree: true });
      const sb = document.getElementById('sidebar');
      if (sb) new MutationObserver(prepararNav).observe(sb, { childList: true, subtree: true });
      // avatar do cabeçalho = iniciais do usuário do rodapé do menu
      const nome = document.querySelector('.user-info strong'), av = document.getElementById('header-avatar'), avSb = document.querySelector('.user-avatar');
      const sync = () => { if (av && avSb && avSb.textContent.trim()) av.textContent = avSb.textContent.trim(); };
      if (nome) new MutationObserver(sync).observe(nome, { childList: true, characterData: true, subtree: true }); sync();
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
  })();

  // ── Notificações push de vendas ──────────────────────────────
  function _atualizarIconePush() {
    const btn = document.getElementById('push-toggle');
    if (!btn) return;
    const ativo = typeof PushNotif !== 'undefined' && PushNotif.ativo();
    btn.style.color = ativo ? 'var(--green)' : '';
    btn.style.borderColor = ativo ? 'var(--green)' : '';
    btn.title = ativo ? 'Notificações de vendas ativas (clique pra desativar)' : 'Ativar notificações de vendas (push)';
  }
  async function _handlePushToggle() {
    if (typeof PushNotif === 'undefined') return;
    const btn = document.getElementById('push-toggle');
    if (btn) btn.disabled = true;
    await PushNotif.toggle();
    if (btn) btn.disabled = false;
    _atualizarIconePush();
  }
  setTimeout(_atualizarIconePush, 300);

  // ── Carrega todos os dados persistidos do localStorage ──────────
  function carregarDadosSalvos() {
    const mapa = {
      glr_clientes:  'clientes',
      glr_gestores:  'gestores',
      glr_acoes:     'acoes',
      glr_tarefas:   'tarefas',
      glr_alertas:   'alertas',
      glr_oportunidades: 'oportunidades',
      glr_logs:      'logs',
    };
    Object.entries(mapa).forEach(([key, prop]) => {
      const raw = localStorage.getItem(key);
      if (raw) { try { GLR[prop] = JSON.parse(raw); } catch(e) {} }
    });
  }
  carregarDadosSalvos();

  // Atualiza badges dinamicamente
  function atualizarBadges() {
    const badgeOpp = document.getElementById('badge-opp');
    const badgeTarefa = document.getElementById('badge-tarefas');

    const nOpp = GLR.oportunidades.length;
    const nTarefa = GLR.tarefas.filter(t => t.status === 'pendente' || t.status === 'atrasada').length;

    if (badgeOpp)    { badgeOpp.textContent = nOpp;    badgeOpp.style.display    = nOpp    ? '' : 'none'; }
    if (badgeTarefa) { badgeTarefa.textContent = nTarefa; badgeTarefa.style.display = nTarefa ? '' : 'none'; }
  }
  atualizarBadges();
</script>

<script>
  // ---- App Init ----
  document.addEventListener('DOMContentLoaded', () => {
    Router.init();
    initSearch();
    handleResponsive();
    window.addEventListener('resize', handleResponsive);
  });

  // ---- Responsive ----
  function handleResponsive() {
    const toggle = document.getElementById('sidebar-toggle');
    if (window.innerWidth <= 900) {
      toggle.style.display = 'flex';
    } else {
      toggle.style.display = 'none';
      document.getElementById('sidebar').classList.remove('open');
    }
  }

  // ---- Global Search ----
  function initSearch() {
    document.addEventListener('click', e => {
      if (!e.target.closest('#search-overlay') && !e.target.closest('#global-search')) {
        document.getElementById('search-overlay').style.display = 'none';
      }
    });
  }

  function handleSearch(q) {
    const overlay = document.getElementById('search-overlay');
    const results = document.getElementById('search-results');
    if (!q.trim()) { overlay.style.display = 'none'; return; }

    const ql = q.toLowerCase();
    const clienteResults = GLR.clientes.filter(c =>
      c.nome.toLowerCase().includes(ql) ||
      c.responsavel.toLowerCase().includes(ql) ||
      c.categoria.toLowerCase().includes(ql)
    );
    const tarefaResults = GLR.tarefas.filter(t =>
      t.titulo.toLowerCase().includes(ql) ||
      t.cliente.toLowerCase().includes(ql)
    );

    if (!clienteResults.length && !tarefaResults.length) {
      results.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">Nenhum resultado para "${q}"</div>`;
      overlay.style.display = 'block';
      return;
    }

    results.innerHTML = `
      ${clienteResults.length ? `
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Clientes</div>
        ${clienteResults.map(c => `
          <div onclick="Router.navigate('cliente-perfil',{id:${c.id}});document.getElementById('search-overlay').style.display='none';document.getElementById('global-search').value='';"
               style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.15s;"
               onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
            <div style="width:28px;height:28px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0;">${c.nome.charAt(0)}</div>
            <div>
              <div style="font-size:13.5px;font-weight:600;">${c.nome}</div>
              <div style="font-size:11.5px;color:var(--text-muted);">${c.categoria} · ${c.gestor}</div>
            </div>
            <span class="badge ${GLR.statusColor[c.status]}" style="margin-left:auto;">${GLR.statusLabel[c.status]}</span>
          </div>
        `).join('')}
      ` : ''}
      ${tarefaResults.length ? `
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 8px;">Tarefas</div>
        ${tarefaResults.slice(0,4).map(t => `
          <div onclick="Router.navigate('tarefas');document.getElementById('search-overlay').style.display='none';document.getElementById('global-search').value='';"
               style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.15s;"
               onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--text-muted);flex-shrink:0;"><path d="M9 11l3 3L22 4"/></svg>
            <div style="flex:1;">
              <div style="font-size:13.5px;font-weight:500;">${t.titulo}</div>
              <div style="font-size:11.5px;color:var(--text-muted);">${t.cliente} · ${formatDate(t.prazo)}</div>
            </div>
            <span class="badge ${GLR.prioridadeColor[t.prioridade]}">${t.prioridade}</span>
          </div>
        `).join('')}
      ` : ''}
    `;
    overlay.style.display = 'block';
  }
</script>
